manifest_version: 2
name: agent-reel
version: 0.1.0
api_version: 1
description: "Turn this machine's Hermes history into a comic: grounded stories, 55 art styles, pages drawn by your own image model."
author: Sahil Saghir
kind: standalone
license: MIT
homepage: https://github.com/Sahil-SS9/agent-reel
tags:
  - comics
  - story
  - history
  - images
requires_plugins: []
python_dependencies:
  - "pillow>=10.0,<14"
requires_hermes: ">=0.21.5"
provides_hooks: []
provides_tools: []
#: Read through agent.secret_scope.get_secret (catalogue rule 11); the environment is only
#: the fallback for a plain CLI run. None are needed for the `host` or `comfyui` routes.
requires_env:
  - OPENAI_API_KEY
  - GEMINI_API_KEY
  - FAL_KEY
